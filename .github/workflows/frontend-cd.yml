name: Caringu Frontend - CD (Deploy via Docker Compose)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-pr:
    name: Lint & Build (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Rodar ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  ssh-check:
    name: Verificação SSH (Proxy → Frontend)
    runs-on: ubuntu-latest
    needs: ci-pr

    env:
      PROXY_HOST: ${{ secrets.PROXY_HOST }}
      FRONTEND1_HOST_IP: ${{ secrets.FRONTEND1_HOST_IP }}
      FRONTEND2_HOST_IP: ${{ secrets.FRONTEND2_HOST_IP }}

    steps:
      - name: Checkout repositório (para acessar scripts)
        uses: actions/checkout@v4

      - name: Clonar repositório de infra (caringu-infra)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/caringu-infra
          path: caringu-infra

      - name: Preparar chave SSH a partir do repositório de infra
        run: |
          cp caringu-infra/iac/caringu.pem ssh_key.pem
          chmod 600 ssh_key.pem

      - name: Tornar script executável
        run: chmod +x scripts/frontend-ssh-check.sh

      - name: Rodar verificação de conectividade SSH
        run: |
          ./scripts/frontend-ssh-check.sh \
            "$PROXY_HOST" \
            "$FRONTEND1_HOST_IP" \
            "$FRONTEND2_HOST_IP" \
            "ssh_key.pem"

  docker-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci-pr

    env:
      DOCKER_IMAGE: vitalistech/caringu-frontend

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  remote-deploy:
    name: Remote Deploy via Proxy → Frontend
    runs-on: ubuntu-latest
    needs:
      - docker-publish
      - ssh-check

    env:
      PROXY_HOST: ${{ secrets.PROXY_HOST }}
      FRONTEND1_HOST_IP: ${{ secrets.FRONTEND1_HOST_IP }}
      FRONTEND2_HOST_IP: ${{ secrets.FRONTEND2_HOST_IP }}
      REMOTE_APP_DIR_FRONTEND: /home/ubuntu/caringu-infra/cloud/public/caringu-frontend

    steps:
      - name: Checkout repositório (para acessar scripts)
        uses: actions/checkout@v4

      - name: Clonar repositório de infra (caringu-infra)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/caringu-infra
          path: caringu-infra

      - name: Preparar chave SSH a partir do repositório de infra
        run: |
          cp caringu-infra/iac/caringu.pem ssh_key.pem
          chmod 600 ssh_key.pem

      - name: Tornar script executável
        run: chmod +x scripts/frontend-deploy.sh

      - name: Executar deploy remoto
        run: |
          ./scripts/frontend-deploy.sh \
            "$PROXY_HOST" \
            "ssh_key.pem" \
            "$REMOTE_APP_DIR_FRONTEND" \
            "$FRONTEND1_HOST_IP" \
            "$FRONTEND2_HOST_IP" \
            ""


