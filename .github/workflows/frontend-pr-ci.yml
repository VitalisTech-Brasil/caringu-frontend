name: Caringu Frontend - PR CI

on:
  push:
    branches:
      - 'feature/*'
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  ci-pr:
    name: Lint & Build (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Rodar ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  ssh-check:
    name: Verificação SSH (Proxy → Frontend)
    runs-on: ubuntu-latest
    needs: ci-pr
    # Só roda na PR de develop -> main (base main), não em feature/* nem develop direto
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    env:
      PROXY_HOST: ${{ secrets.PROXY_HOST }}
      FRONTEND1_HOST_IP: ${{ secrets.FRONTEND1_HOST_IP }}
      FRONTEND2_HOST_IP: ${{ secrets.FRONTEND2_HOST_IP }}

    steps:
      - name: Checkout repositório (para acessar scripts)
        uses: actions/checkout@v4

      - name: Clonar repositório de infra (caringu-infra)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/caringu-infra
          path: caringu-infra

      - name: Preparar chave SSH a partir do repositório de infra
        run: |
          cp caringu-infra/iac/caringu.pem ssh_key.pem
          chmod 600 ssh_key.pem

      - name: Tornar script executável
        run: chmod +x scripts/frontend-ssh-check.sh

      - name: Rodar verificação de conectividade SSH
        run: |
          ./scripts/frontend-ssh-check.sh \
            "$PROXY_HOST" \
            "$FRONTEND1_HOST_IP" \
            "$FRONTEND2_HOST_IP" \
            "ssh_key.pem"


