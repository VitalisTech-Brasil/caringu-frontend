name: Caringu Frontend - CI (Lint)

on:
  push:
    branches:
      - 'feature/*'
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências (sem scripts pós-instalação)
        run: npm install --ignore-scripts

      - name: Rodar ESLint
        run: npm run lint


